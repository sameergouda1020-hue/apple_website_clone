<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple Store | Discover Innovation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="script.js"></script>
</head>
<body class="bg-white text-gray-900">
  <nav class="flex items-center justify-between px-5 md:px-12 py-5 border-b">
    <a href="index.html" class="text-2xl font-bold">Apple Store</a>
    <div class="flex gap-4">
      <a href="login.html" class="font-medium">Login</a>
      <a href="registration.html" class="bg-black text-white px-4 py-2 rounded-full">Register</a>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-5">
    <section class="text-center py-20 md:py-28">
      <p class="text-blue-600 font-semibold mb-4">Innovation starts here.</p>
      <h1 class="text-4xl md:text-7xl font-bold tracking-tight">
        Meet your next<br>favorite thing.
      </h1>
      <p class="text-gray-500 mt-6 max-w-xl mx-auto">
        Discover thoughtfully designed Apple-inspired products for work,
        creativity and everyday life.
      </p>
      <div class="flex justify-center gap-3 mt-8">
        <a href="login.html" class="bg-blue-600 text-white px-6 py-3 rounded-full">Shop Now</a>
        <a href="#featured" class="border px-6 py-3 rounded-full">Explore</a>
      </div>
    </section>

    <section id="featured" class="pb-20">
      <h2 class="text-3xl font-bold mb-8 text-center">Featured Products</h2>
      <div id="featuredProducts" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
    </section>
  </main>

  <footer class="border-t py-6 text-center text-sm text-gray-500">
    Apple Store Demo Project · Designed for learning
  </footer>
</body>
</html>
