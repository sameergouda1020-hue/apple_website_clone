<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page </title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center p-5">
    <div class="bg-white w-full max-w-md rounded-3xl shadow-lg p-8">
        <a href="index.html" class="text-xl font-bold">Apple Store</a>
        <h1 class="text-3xl font-semibold mt-7">Welcome back.</h1>
        <p class="text-gray-500 mt-2 mb-6">Login to your account.</p>

        <form id="loginForm" class="space-y-4">
            <input id="email" type="email" placeholder="Email address" required class="w-full border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <input id="password" type="password" placeholder="Password" required class="w-full border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button type="submit" class="w-full bg-blue-600 text-white rounded-xl py-3 font-medium hover:bg-blue-700">Login</button>
        </form>

        <p class="text-center text-gray-600 mt-6">Don't have an account? <a href="regi.html" class="text-blue-600 font-medium">Register</a></p>
        <p class="text-center mt-4"><a href="index.html" class="text-sm text-gray-500 hover:underline">Back to Home</a></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
