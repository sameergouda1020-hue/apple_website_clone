<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Apple Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="script.js"></script>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
  <main class="bg-white w-full max-w-md rounded-3xl shadow-sm border p-7 md:p-9">
    <a href="index.html" class="text-xl font-bold">Apple Store</a>
    <h1 class="text-3xl font-bold mt-7">Welcome back.</h1>
    <p class="text-gray-500 mt-2 mb-6">Login to continue shopping.</p>

    <form id="loginForm" class="space-y-4">
      <input id="email" name="email" type="email" required placeholder="Email address"
        class="w-full border rounded-xl p-3 outline-none focus:ring-2 focus:ring-blue-500">
      <input id="password" name="password" type="password" required placeholder="Password"
        class="w-full border rounded-xl p-3 outline-none focus:ring-2 focus:ring-blue-500">
      <p id="loginMessage" class="text-sm" aria-live="polite"></p>
      <button class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-xl py-3 font-semibold">
        Login
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6">
      New here? <a href="registration.html" class="text-blue-600 font-semibold">Create account</a>
    </p>
  </main>
</body>
</html>
