<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Apple Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center px-5">

    <div class="bg-white w-full max-w-md rounded-3xl p-8 shadow-sm">

        <div class="text-center mb-8">
            <a href="index.html" class="text-2xl font-semibold">
                Apple Store
            </a>

            <h1 class="text-3xl font-semibold mt-8">
                Sign in
            </h1>

            <p class="text-gray-500 mt-2">
                Sign in to continue shopping.
            </p>
        </div>

        <form>

            <div class="mb-5">
                <label class="block text-sm font-medium mb-2">
                    Email
                </label>

                <input
                    type="email"
                    placeholder="Enter your email"
                    class="w-full border border-gray-300 rounded-xl px-4 py-3 outline-none focus:border-blue-500">
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium mb-2">
                    Password
                </label>

                <input
                    type="password"
                    placeholder="Enter your password"
                    class="w-full border border-gray-300 rounded-xl px-4 py-3 outline-none focus:border-blue-500">
            </div>

            <button
                type="submit"
                class="w-full bg-black text-white py-3 rounded-full">
                Login
            </button>

        </form>

        <p class="text-center text-sm text-gray-500 mt-6">
            Don't have an account?
            <a href="registration.html" class="text-blue-600">
                Create account
            </a>
        </p>

    </div>

</body>
</html>
