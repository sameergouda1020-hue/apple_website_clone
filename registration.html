<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Apple Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="script.js"></script>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
  <main class="bg-white w-full max-w-md rounded-3xl shadow-sm border p-7 md:p-9">
    <a href="index.html" class="text-xl font-bold">Apple Store</a>
    <h1 class="text-3xl font-bold mt-7">Create account</h1>
    <p class="text-gray-500 mt-2 mb-6">Join us and explore our products.</p>

    <form id="registerForm" class="space-y-4">
      <input id="name" name="name" required placeholder="Full name"
        class="w-full border rounded-xl p-3 outline-none focus:ring-2 focus:ring-blue-500">
      <input id="email" name="email" type="email" required placeholder="Email address"
        class="w-full border rounded-xl p-3 outline-none focus:ring-2 focus:ring-blue-500">
      <input id="mobile" name="mobile" type="tel" pattern="[0-9]{10}" maxlength="10"
        required placeholder="10-digit mobile number"
        class="w-full border rounded-xl p-3 outline-none focus:ring-2 focus:ring-blue-500">
      <input id="password" name="password" type="password" minlength="6" required
        placeholder="Password (minimum 6 characters)"
        class="w-full border rounded-xl p-3 outline-none focus:ring-2 focus:ring-blue-500">
      <input id="confirmPassword" name="confirmPassword" type="password" minlength="6"
        required placeholder="Confirm password"
        class="w-full border rounded-xl p-3 outline-none focus:ring-2 focus:ring-blue-500">
      <p id="registerMessage" class="text-sm" aria-live="polite"></p>
      <button class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-xl py-3 font-semibold">
        Create Account
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6">
      Already registered? <a href="login.html" class="text-blue-600 font-semibold">Login</a>
    </p>
  </main>
</body>
</html>
